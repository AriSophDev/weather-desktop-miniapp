name: Tauri + Bun Multiplatform Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Instalar dependencias del sistema necesarias en Linux (Gtk / WebKit / RPM tools)
      - name: Instalar dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm

      # 2. Configurar entorno de ejecucion
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # 3. Cache para acelerar la compilacion de Rust
      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      # 4. Instalar dependencias del frontend e iniciar el Build
      - name: Instalar dependencias del frontend
        run: bun install --frozen-lockfile

      - name: Compilar Tauri
        run: bunx tauri build ${{ matrix.args }}

      # 5. Guardar los ejecutables e instaladores resultantes como artefactos descargables
      - name: Guardar ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
